<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceBook || Dashboard</title>
    <link rel="stylesheet" href="dashbord.css">
</head>

<body>
    <header>
        <div class="left-header">
            <img src="../Assets/images/Facebook Logo.png" alt="" width="40px" height="40px">
            <div class="search-input">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search Facebook" id="searchInput">
            </div>
        </div>

        <div class="center-header">
            <div class="all-pages-icons">
                <div class="home">
                    <img src="../Assets/images//home.svg" alt="" width="25px">
                </div>
                <div class="friend">
                    <img src="../Assets/images/friends.svg" alt="" width="25px">
                </div>
                <div class="reels">
                    <img src="../Assets/images/reels.svg" alt="" width="25px">
                </div>
                <div class="marketplace">
                    <img src="../Assets/images/marketplace.svg" alt="" width="25px">
                </div>
                <div class="groups">
                    <img src="../Assets/images/groups.svg" alt="" width="25px">
                </div>
            </div>
        </div>

        <div class="right-header">
            <div class="btn-backgroung">
                <img src="../Assets/images/menu.svg" alt="" width="22px">
            </div>
            <div class="btn-backgroung">
                <img src="../Assets/images/messenger.svg" alt="" width="22px">
            </div>
            <div class="btn-backgroung">
                <img src="../Assets/images/notification.svg" alt="" width="22px">
            </div>
            <div class="">
                <img src="../Assets/images/profile pic.png" alt="" width="40px">
            </div>
        </div>
    </header>

    <main>
        <div class="main-left">
            <H1>asami</H1>
        </div>
        <div class="main-center">
            <div class="create-post">
                <div class="">
                    <img src="../Assets/images/profile pic.png" alt="profile picture" width="35px" height="35px">
                    <button id="create-Post-Input">What's on your mind, Asami?</button>
                </div>
                <div class="">
                    <img src="../Assets/images/Create-post-Video-btn.png" alt="">
                    <img src="../Assets/images/Create-post-Photo-btn.png" alt="">
                    <img src="../Assets/images/Create-post-Emoji-btn.png" alt="">
                </div>
            </div>
        </div>
        <div class="main-right">
            <H1>asami</H1>
        </div>
    </main>

    <!-- Font Awsome -->
    <script src="https://kit.fontawesome.com/f882a661c8.js" crossorigin="anonymous"></script>
    <!-- JS File -->
    <script src="dashbord.js"></script>
</body>

</html>
